name: mkanak
description: ""

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_localizations:
