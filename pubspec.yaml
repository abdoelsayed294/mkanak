  bloc: ^9.2.1
  google_maps_flutter: ^2.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.13.0+1
  freezed: ^4.0.3
  json_serializable: ^6.8.0
  retrofit_generator: ^10.3.3
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
